<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanyi OS – Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,#dfe5ff,transparent 30%),radial-gradient(circle at 85% 15%,#d7f5ec,transparent 30%),linear-gradient(135deg,#f7f9ff,#f2faf7);color:#1d2937}.card{width:min(520px,calc(100% - 32px));padding:28px;border-radius:26px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(52,73,94,.14);backdrop-filter:blur(20px)}h1{margin:0 0 8px;font-size:30px}p{color:#6e7a89;line-height:1.55}.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer;background:linear-gradient(135deg,#7588ff,#9b8cff);color:white;box-shadow:0 10px 24px rgba(117,136,255,.25)}.box{margin-top:18px;padding:15px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid rgba(45,65,85,.08);word-break:break-all}.ok{color:#2a8c72;font-weight:800}.muted{font-size:13px;color:#6e7a89}</style></head><body><main class="card"><h1>Sanyi OS 🔐</h1><p>Firebase kapcsolat ellenőrzése. Jelentkezz be a saját Google-fiókoddal.</p><button id="login" class="btn">Belépés Google-fiókkal</button><div id="result" class="box"><span class="muted">Még nem vagy bejelentkezve.</span></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';const firebaseConfig={apiKey:'AIzaSyB4scm4BHDr_itNL2Ppw3VT1RE3tXkLwfo',authDomain:'sanyi-os.firebaseapp.com',projectId:'sanyi-os',storageBucket:'sanyi-os.firebasestorage.app',messagingSenderId:'957587817233',appId:'1:957587817233:web:f6748d9a518bca9a2742b0'};const app=initializeApp(firebaseConfig),auth=getAuth(app),provider=new GoogleAuthProvider(),btn=document.getElementById('login'),out=document.getElementById('result');btn.onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){out.innerHTML='<b>Hiba:</b> '+e.code+'<br><span class="muted">'+e.message+'</span>'}};onAuthStateChanged(auth,u=>{if(!u)return;btn.style.display='none';out.innerHTML='<div class="ok">✓ Firebase Authentication működik</div><p><b>Név:</b> '+(u.displayName||'—')+'<br><b>Email:</b> '+(u.email||'—')+'</p><div class="muted">UID – erre fogjuk lezárni a Firestore hozzáférést:</div><div style="margin-top:6px;font-weight:800">'+u.uid+'</div>'});</script></body></html>
