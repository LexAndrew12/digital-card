<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanyi OS – Firestore Test</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,#dfe5ff,transparent 30%),radial-gradient(circle at 85% 15%,#d7f5ec,transparent 30%),linear-gradient(135deg,#f7f9ff,#f2faf7);color:#1d2937}.card{width:min(560px,calc(100% - 32px));padding:28px;border-radius:26px;background:#ffffffb8;border:1px solid white;box-shadow:0 24px 70px #34495e24;backdrop-filter:blur(20px)}h1{margin:0 0 8px}p{color:#6e7a89;line-height:1.55}.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer;background:linear-gradient(135deg,#61ccb0,#7588ff);color:white;box-shadow:0 10px 24px #7588ff40}.box{margin-top:18px;padding:15px;border-radius:16px;background:#ffffffb8;border:1px solid #2d415517;word-break:break-word}.ok{color:#2a8c72;font-weight:800}.err{color:#b33;font-weight:800}.muted{font-size:13px;color:#6e7a89}</style></head><body><main class="card"><h1>🪴 Sanyi OS</h1><p>Első valódi Firestore-adat: növényöntözés.</p><button id="action" class="btn">Google belépés</button><div id="result" class="box"><span class="muted">Kapcsolódás...</span></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyB4scm4BHDr_itNL2Ppw3VT1RE3tXkLwfo',authDomain:'sanyi-os.firebaseapp.com',projectId:'sanyi-os',storageBucket:'sanyi-os.firebasestorage.app',messagingSenderId:'957587817233',appId:'1:957587817233:web:f6748d9a518bca9a2742b0'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),btn=document.getElementById('action'),out=document.getElementById('result');let user=null;btn.onclick=async()=>{if(!user){try{await signInWithPopup(auth,provider)}catch(e){out.innerHTML='<span class="err">Belépési hiba:</span> '+e.code}return}btn.disabled=true;out.innerHTML='Mentés a Firestore-ba...';try{const ref=await addDoc(collection(db,'plantWaterings'),{type:'plant_watering',wateredAt:serverTimestamp(),createdBy:user.uid,source:'sanyi-os-web'});out.innerHTML='<div class="ok">✓ Sikeresen elmentve a Firestore-ba</div><p>Dokumentum ID:<br><b>'+ref.id+'</b></p><div class="muted">Ez már nem localStorage: valódi felhős adat.</div>'}catch(e){out.innerHTML='<span class="err">Firestore hiba:</span> '+e.code+'<br><span class="muted">'+e.message+'</span>'}finally{btn.disabled=false}};onAuthStateChanged(auth,u=>{user=u;if(u){btn.textContent='🪴 Megöntöztem';out.innerHTML='<div class="ok">✓ Bejelentkezve</div><p>'+u.email+'</p><div class="muted">Nyomd meg a gombot az első Firestore eseményhez.</div>'}else{btn.textContent='Google belépés';out.innerHTML='<span class="muted">Jelentkezz be a folytatáshoz.</span>'}});</script></body></html>
