<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanyi OS NFC</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 12% 10%,#dfe6ff,transparent 30%),radial-gradient(circle at 88% 12%,#ddf7ee,transparent 30%),linear-gradient(135deg,#f6f9ff,#eef9f5);color:#1d2937}.card{width:min(92vw,560px);background:#ffffffd2;border:1px solid #fff;border-radius:26px;padding:24px;box-shadow:0 20px 60px #52657a22;backdrop-filter:blur(18px)}h1{margin:0 0 8px}.muted{color:#6e7a89}.ok{font-size:42px;margin-bottom:8px}.btn,a{display:inline-block;margin-top:14px;padding:10px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,#7588ff,#9b8cff);color:#fff;text-decoration:none;font-weight:800;cursor:pointer}code{display:block;word-break:break-all;background:#f5f7fb;padding:10px;border-radius:12px;margin-top:12px}</style></head><body><div class="card"><div class="ok" id="icon">⌁</div><h1 id="title">Sanyi OS NFC</h1><p class="muted" id="msg">Feldolgozás...</p><div id="auth"></div><code id="detail"></code><a href="./">Dashboard megnyitása</a></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,collection,addDoc,doc,getDoc,setDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const cfg={apiKey:'AIzaSyB4scm4BHDr_itNL2Ppw3VT1RE3tXkLwfo',authDomain:'sanyi-os.firebaseapp.com',projectId:'sanyi-os',storageBucket:'sanyi-os.firebasestorage.app',messagingSenderId:'957587817233',appId:'1:957587817233:web:f6748d9a518bca9a2742b0'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),q=new URLSearchParams(location.search),action=q.get('action');const I=id=>document.getElementById(id);function done(i,t,m,d=''){I('icon').textContent=i;I('title').textContent=t;I('msg').textContent=m;I('detail').textContent=d}async function run(u){try{if(action==='water'){await addDoc(collection(db,'plantWaterings'),{type:'plant_watering',wateredAt:serverTimestamp(),createdBy:u.uid,source:'nfc'});done('🪴','Öntözés rögzítve','A Firestore-ba mentve.',new Date().toLocaleString('hu-HU'))}else if(action==='capture'){const text=(q.get('text')||'').trim(),type=q.get('type')||'Ötlet',rem=q.get('reminder')||null;if(!text)return done('✦','Hiányzó szöveg','A Shortcut adjon át text paramétert.','?action=capture&type=Ötlet&text=...');await addDoc(collection(db,'captures'),{type,text,reminder:rem,createdAt:serverTimestamp(),createdBy:u.uid,source:'nfc'});done('✦','Capture elmentve',type+': '+text,rem?'Emlékeztető: '+rem:'Nincs emlékeztető')}else if(action==='start'){const ref=doc(db,'state','currentActivity'),snap=await getDoc(ref);if(snap.exists())return done('◴','Már fut aktivitás',snap.data().name,'Indítva: '+snap.data().startedAt);const name=(q.get('name')||'Fókusz').trim();await setDoc(ref,{name,startedAt:new Date().toISOString(),createdBy:u.uid,source:'nfc'});done('▶','Aktivitás elindítva',name,new Date().toLocaleString('hu-HU'))}else if(action==='stop'){const ref=doc(db,'state','currentActivity'),snap=await getDoc(ref);if(!snap.exists())return done('■','Nincs futó aktivitás','Nincs mit lezárni.');const cur=snap.data(),end=new Date(),start=new Date(cur.startedAt);await addDoc(collection(db,'activities'),{name:cur.name,startedAt:cur.startedAt,endedAt:serverTimestamp(),durationMs:end-start,createdBy:u.uid,source:'nfc'});await deleteDoc(ref);done('■','Aktivitás lezárva',cur.name,Math.max(1,Math.round((end-start)/60000))+' perc')}else done('⌁','Sanyi OS NFC Hub','Használható akciók: water, capture, start, stop.','?action=water')}catch(e){done('⚠️','NFC hiba',e.code||'Ismeretlen hiba',e.message||'')}}onAuthStateChanged(auth,u=>{if(u){I('auth').innerHTML='';run(u)}else{done('🔐','Bejelentkezés szükséges','Az NFC-akció biztonságos Firebase-hozzáférést használ.','');const b=document.createElement('button');b.className='btn';b.textContent='Belépés Google-fiókkal';b.onclick=()=>signInWithPopup(auth,provider);I('auth').appendChild(b)}});</script></body></html>
