<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanyi OS NFC</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3ff,#eefaf6);color:#1d2937}.card{width:min(92vw,560px);background:#ffffffcc;border:1px solid #fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px #52657a22;backdrop-filter:blur(18px)}h1{margin:0 0 8px}.muted{color:#6e7a89}.ok{font-size:42px;margin-bottom:8px}code{display:block;word-break:break-all;background:#f5f7fb;padding:10px;border-radius:12px;margin-top:12px}a{display:inline-block;margin-top:16px;padding:10px 14px;border-radius:12px;background:#7588ff;color:#fff;text-decoration:none;font-weight:700}</style></head><body><div class="card"><div class="ok" id="icon">⌁</div><h1 id="title">NFC feldolgozás</h1><p class="muted" id="msg">A Sanyi OS feldolgozza az NFC akciót.</p><code id="detail"></code><a href="./">Dashboard megnyitása</a></div><script>const S={g:(k,d)=>{try{return JSON.parse(localStorage.getItem('sos_'+k))??d}catch{return d}},s:(k,v)=>localStorage.setItem('sos_'+k,JSON.stringify(v))};const q=new URLSearchParams(location.search),action=q.get('action');let C=S.g('captures',[]),A=S.g('activities',[]),P=S.g('plant',[]),cur=S.g('current',null);const title=document.getElementById('title'),msg=document.getElementById('msg'),icon=document.getElementById('icon'),detail=document.getElementById('detail');function done(i,t,m,d=''){icon.textContent=i;title.textContent=t;msg.textContent=m;detail.textContent=d}if(action==='water'){const now=new Date().toISOString();P.unshift(now);S.s('plant',P);done('🪴','Öntözés rögzítve','Az NFC tag elmentette a növény öntözését.',new Date(now).toLocaleString('hu-HU'))}else if(action==='capture'){const text=(q.get('text')||'').trim(),type=q.get('type')||'Ötlet',rem=q.get('reminder')||null;if(text){const item={id:Date.now(),type,text,rem,at:new Date().toISOString(),source:'NFC'};C.unshift(item);S.s('captures',C);done('✦','Capture elmentve',type+': '+text,rem?'Emlékeztető: '+rem:'Nincs emlékeztető')}else{done('✦','Capture NFC kész','A Shortcut adjon át text paramétert.','?action=capture&type=Ötlet&text=...')}}else if(action==='start'){if(cur){done('◴','Már fut aktivitás',cur.name,'Indítva: '+new Date(cur.start).toLocaleString('hu-HU'))}else{const name=(q.get('name')||'Fókusz').trim();cur={name,start:new Date().toISOString(),source:'NFC'};S.s('current',cur);done('▶','Aktivitás elindítva',name,new Date(cur.start).toLocaleString('hu-HU'))}}else if(action==='stop'){if(!cur){done('■','Nincs futó aktivitás','Nincs mit lezárni.')}else{const end=new Date();A.unshift({name:cur.name,start:cur.start,end:end.toISOString(),dur:end-new Date(cur.start),source:'NFC'});S.s('activities',A);S.s('current',null);done('■','Aktivitás lezárva',cur.name,Math.max(1,Math.round((end-new Date(cur.start))/60000))+' perc')}}else{done('⌁','Sanyi OS NFC Hub','Használható akciók: water, capture, start, stop.','Példa: ?action=water')}</script></body></html>
